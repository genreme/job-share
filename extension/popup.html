<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 380px;
      padding: 16px;
      background: #f7f9fc;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid #667eea;
    }

    .header h1 {
      font-size: 16px;
      color: #1a202c;
    }

    .header .logo {
      font-size: 24px;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
    }

    .status.success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #6ee7b7;
    }

    .status.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .status.info {
      background: #dbeafe;
      color: #1e40af;
      border: 1px solid #93c5fd;
    }

    .job-preview {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .job-preview h2 {
      font-size: 15px;
      color: #1a202c;
      margin-bottom: 8px;
    }

    .job-preview .company {
      font-size: 14px;
      color: #667eea;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .job-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 12px;
      color: #64748b;
    }

    .job-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 4px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 13px;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 60px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: white;
      color: #667eea;
      border: 2px solid #667eea;
      margin-top: 8px;
    }

    .not-linkedin {
      text-align: center;
      padding: 20px;
    }

    .not-linkedin p {
      color: #64748b;
      font-size: 13px;
      margin-top: 10px;
    }

    .connection-input {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .connection-input input {
      flex: 1;
    }

    .connection-input button {
      padding: 8px 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    .connections-list {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .connection-tag {
      background: #e0e7ff;
      color: #4338ca;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .connection-tag button {
      background: none;
      border: none;
      color: #4338ca;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
    }

    .footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #e2e8f0;
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
    }

    .footer a {
      color: #667eea;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🎯</span>
    <h1>Job Search Command Center</h1>
  </div>

  <div id="content">
    <!-- Content will be injected by JavaScript -->
    <div class="status info">Checking page...</div>
  </div>

  <div class="footer">
    <a href="#" id="openDashboard">Open Dashboard</a> |
    <a href="#" onclick="sendToDashboard(); return false;" id="sendToDashboard" style="display: none;">Send All to Dashboard</a>
    <span id="jobCount">0 pending jobs</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
